version: 2
updates:
  # Security fixes open as they are published. This schedule is everything else,
  # folded into one pull request so the queue stays short.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
