name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # The OpenGL fallback (PLAN.md, Locked decisions) must keep building.
      - run: cargo clippy -p inkmark --features glow --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Layout tests shape real text; give them the same fonts every run.
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-core
      - run: cargo test --workspace --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-core
      - name: Run tests with coverage
        # measure.rs is the app's self-measurement mode (scripts/measure.sh),
        # not something the tests can or should drive.
        run: cargo llvm-cov --workspace --locked --no-report
      - name: Reports
        run: |
          IGNORE='crates/inkmark/src/measure\.rs'
          cargo llvm-cov report --ignore-filename-regex "$IGNORE" --lcov --output-path lcov.info
          cargo llvm-cov report --ignore-filename-regex "$IGNORE" --html --output-dir coverage
          {
            echo '## Coverage'
            echo
            echo '```'
            cargo llvm-cov report --ignore-filename-regex "$IGNORE" --summary-only \
              | sed "s#$PWD/##"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage/html

  build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p inkmark
      - uses: actions/upload-artifact@v7
        with:
          name: inkmark-linux-x86_64
          path: target/release/inkmark
