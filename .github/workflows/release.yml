name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build,
# test and publish a GitHub release with the Linux binary.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "inkmark"))')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match inkmark's version ${version} in Cargo.toml"
            exit 1
          fi

      - name: Fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-core
      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        run: scripts/package.sh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "inkmark ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
