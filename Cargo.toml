[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
inkmark-buffer = { path = "crates/inkmark-buffer" }
inkmark-files = { path = "crates/inkmark-files" }
inkmark-parse = { path = "crates/inkmark-parse" }
inkmark-text = { path = "crates/inkmark-text" }
inkmark-view = { path = "crates/inkmark-view" }
inkmark-minimap = { path = "crates/inkmark-minimap" }

cosmic-text = "0.19.0"
eframe = "0.36.2"
egui = "0.36.2"
# Live-view images; formats limited to keep the build lean (no SVG).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
notify = "8.2.0"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
# Gzipped SVG (.svgz), inflated with a size cap.
flate2 = "1.1.10"
# SVG images in the live view (text with system fonts; no embedded rasters).
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
# Live-pane formulas. SVG only: its egui feature is egui 0.28.
latex-rust = { version = "2.1.0", default-features = false, features = ["std"] }
# Renames that never overwrite (renameat2 RENAME_NOREPLACE).
rustix = { version = "1.1.5", features = ["fs"] }
rfd = "0.17.2"
# The freedesktop trash for Delete in the file browser.
trash = "5.2.9"
# Display width of table cells (CJK counts double) when re-padding.
unicode-width = "0.2.2"
# Omarchy's colors.toml and inkmark's config file.
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
# LF-only line breaks: files are normalized to LF on load (PLAN.md §1).
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
# Searches a rope without copying it into one string. The `ropey` feature
# is the cursor over ropey's chunks.
regex-cursor = { version = "0.1.5", features = ["ropey"] }
unicode-segmentation = "1.13.3"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
