[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
inkmark-buffer = { path = "crates/inkmark-buffer" }
inkmark-files = { path = "crates/inkmark-files" }
inkmark-parse = { path = "crates/inkmark-parse" }
inkmark-text = { path = "crates/inkmark-text" }
inkmark-view = { path = "crates/inkmark-view" }
inkmark-minimap = { path = "crates/inkmark-minimap" }

cosmic-text = "0.19.0"
eframe = "0.36.2"
egui = "0.36.2"
# Live-view images; formats limited to keep the build lean (no SVG).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
notify = "8.2.0"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
# Renames that never overwrite (renameat2 RENAME_NOREPLACE).
rustix = { version = "1.1.5", features = ["fs"] }
rfd = "0.17.2"
# The freedesktop trash for Delete in the file browser.
trash = "5.2.9"
# LF-only line breaks: files are normalized to LF on load (PLAN.md §1).
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "1.13.3"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
